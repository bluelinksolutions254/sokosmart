.fcd h4{margin:2px 0 0;font-size:15px;color:#1d1a16}.fcd p{margin:0;font-size:13px;color:#6b625a;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.fpr{background:#FFF3E3;border-radius:8px;text-align:center;padding:9px;font-weight:800;font-size:17px;color:#1d1a16}

.fcta u{color:#D9740A}.fcta .btn{background:#0B4A2E;border-color:#0B4A2E;color:#fff;font-weight:700}.fcta[hidden]{display:none}
@media(max-width:1000px){.fcc{display:none}.flay{grid-template-columns:1fr}}

.fmo.n1{grid-template-columns:1fr}.fmo.n2{grid-template-columns:1fr 1fr}.fmo.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}.fmo.n3 img:first-child{grid-row:span 2}

.fcv2{height:150px;position:relative;overflow:hidden}.fav2{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700}.fav2.on{background:#14633F}.fav2:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#bbb;margin-right:6px}.fav2.on:before{background:#7CF2A8}
.fcd .fid{margin-top:-28px}.fid small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fchip{display:inline-block;background:#FFF3E3;color:#B45F06;border:1px solid #F9B35C;border-radius:20px;padding:3px 12px;font-size:13px;font-weight:700}
.fst{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:6px;font-size:12.5px;color:#6b625a;border-top:1px solid #eee7dc;border-bottom:1px solid #eee7dc;padding:8px 0}.fst b{color:#1d1a16}
.floc{display:flex;gap:5px;align-items:center;font-size:12.5px;color:#6b625a}
.fpr{background:#F4F7F5;border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:18px;font-weight:800;color:#0B4A2E}.fpr small{font-size:11.5px;font-weight:500;color:#6b625a}
.fbt{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fhire.w{background:#fff;color:#0B4A2E;border:1.5px solid #0B4A2E}.fhire.w:hover{background:#F4F7F5}
.tvh{background:linear-gradient(105deg,#0B4A2E,#14633F);margin:-4px -4px 0;border-radius:14px 14px 0 0;padding:20px}.tvb{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.tvb .av{border:3px solid #fff}
.tvs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.tvs div{background:#F4F7F5;border-radius:12px;padding:12px;text-align:center}.tvs b{font-size:20px;display:block;color:#0B4A2E}.tvs small{color:#6b625a;font-size:12px}
.tvsp{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#FFF8EF;border:1px solid #F9B35C;border-radius:14px;padding:14px 16px;margin-bottom:6px}
.pfg{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.pfg a img{transition:transform .2s}.pfg a:hover img{transform:scale(1.05)}
.pc{border:1px solid #eee7dc}.pc:hover{border-color:#F58E20}

.fcd .fid{margin-top:0;align-items:center;padding-top:12px}.fcd .fid .av{width:52px;height:52px;font-size:21px;border:2px solid #fff;box-shadow:0 0 0 1px #eee7dc}
.fcd .fid div{padding:0}.fcd .fid b{font-size:15px}.fcv2{z-index:0}.fcb2{position:relative;z-index:1;background:#fff;padding:0 14px 14px;gap:10px}
.fcd .fst{grid-template-columns:repeat(3,minmax(0,1fr));text-align:center}.fcd .fst span:first-child{text-align:left}.fcd .fst span:last-child{text-align:right}
.fcd .fpr{flex-wrap:wrap}.fcd .fpr b{font-size:18px}.fcd .fbt .fhire{padding:10px 6px;min-width:0;white-space:nowrap}

.gls{display:grid;gap:14px}.gp2{background:#fff;border-radius:14px;padding:18px;display:grid;gap:10px;box-shadow:0 1px 4px rgba(11,74,46,.1);border:1px solid #eee7dc}.gp2:hover{border-color:#F58E20}
.gph{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}.gp2 h3{margin:8px 0 2px;font-size:18px;color:#1d1a16}.gp2 p{margin:0;font-size:14px;line-height:1.6;color:#4b443d;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gpf{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid #eee7dc;padding-top:10px}

/* ===================== SOKO Smart Freelance – green & orange (marketplace layout) ===================== */
:root{--gn:#0F5C34;--gd:#0B4A2E;--gl:#E7F2DD;--or:#F58E20;--or2:#F5A12E;--od2:#D9740A;--cr:#FFF3E3;--pg:#F2F4EF;--ln:#E4E8DE;--ink:#17261D;--mu:#66746A}
.fx{background:var(--pg);padding:16px 0 34px}
.fapp{display:grid;grid-template-columns:248px minmax(0,1fr);gap:20px;align-items:start}
.fmain{min-width:0;display:grid;gap:16px}
/* left navigation */
.fnavside{position:sticky;top:calc(var(--st,0px) + 14px);background:#fff;border:1px solid var(--ln);border-radius:20px;padding:12px;display:grid;gap:14px;box-shadow:0 2px 10px rgba(11,74,46,.06)}
#ft2{display:grid;gap:4px;overflow:visible}
#ft2 button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-radius:14px;padding:12px 14px;color:var(--ink);font:inherit;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
#ft2 button svg{flex:none;color:var(--gn)}
#ft2 button:hover{background:#F3F7EE;color:var(--ink)}
#ft2 button.on{background:var(--gl);color:var(--gd);font-weight:700;box-shadow:inset 4px 0 0 var(--gn)}
#ft2 button:focus-visible,.ct:focus-visible,.fopen:focus-visible,.vtog button:focus-visible,.sg:focus-visible,.tc2:focus-visible{outline:3px solid rgba(245,142,32,.6);outline-offset:2px}
.fnavside .fcta{display:grid;justify-items:center;text-align:center;gap:6px;margin:0;padding:18px 14px;background:linear-gradient(180deg,#F1F7E8,#E7F2DD);border:0;border-radius:18px;font-size:14px;color:var(--ink)}
.fnavside .fcta[hidden]{display:none}
.fnavside .fcta svg{color:var(--gn)}
.fnavside .fcta h3{margin:2px 0 0;font-size:18px;line-height:1.2;font-weight:800;color:var(--ink)}
.fnavside .fcta p{margin:0 0 6px;color:#3d4d43;font-size:13.5px;line-height:1.45}
.fnavside .fcta .btn{background:var(--or);border-color:var(--or);color:#fff;font-weight:700;border-radius:999px;padding:10px 18px}
.fnavside .fcta .btn:hover{background:var(--od2);border-color:var(--od2)}
/* top bar */
.fstick{position:sticky;top:var(--st,0px);z-index:30;display:flex;gap:12px;align-items:center;background:rgba(242,244,239,.94);backdrop-filter:blur(8px);padding:6px 0;margin:0}
.fstick.stuck{box-shadow:0 8px 18px -10px rgba(11,74,46,.35);padding:8px 0}
.fsrch{flex:1;min-width:0;background:#fff;border:1px solid var(--ln);box-shadow:none;border-radius:999px;padding:4px 4px 4px 18px}
.fsrch:focus-within{border-color:var(--gn);box-shadow:0 0 0 3px rgba(15,92,52,.14)}
.fsrch .btn,.fsrch .btn:hover{background:var(--gn);border-color:var(--gn);color:#fff;font-weight:700;border-radius:999px;padding:11px 26px}
.fsrch .btn:hover{background:var(--gd)}
.ftop{display:flex;gap:10px;align-items:center;flex:none}
.ftop .btn{display:inline-flex;align-items:center;gap:8px;border-radius:14px;font-weight:700;padding:11px 18px;white-space:nowrap}
#fpost{background:var(--gn);border-color:var(--gn);color:#fff}#fpost:hover{background:var(--gd);border-color:var(--gd)}
#beF{background:#fff;border:1.5px solid var(--gn);color:var(--gn)!important}#beF:hover{background:var(--gl)}
/* hero banner */
.fhero{position:relative;overflow:hidden;border-radius:22px;padding:30px 34px;min-height:150px;display:grid;align-items:center;color:#fff;background:linear-gradient(105deg,#0B4A2E 0%,#10613A 60%,#17703F 100%)}
.fhero:before{content:"";position:absolute;right:-30px;top:0;bottom:0;width:44%;background:linear-gradient(135deg,#F5A12E,#F58E20);clip-path:polygon(32% 0,100% 0,100% 100%,0 100%);border-radius:0;z-index:0}
.fhero:after{content:"";position:absolute;right:38%;top:22px;width:46px;height:46px;border-radius:0;background:none;border-top:5px solid #F5A12E;border-left:5px solid #F5A12E;transform:rotate(-8deg) scaleX(.0);opacity:0}
.fhero>.fpic{position:absolute;right:0;top:0;bottom:0;width:40%;z-index:1;background:var(--fimg,none) center/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent,#000 28%);mask-image:linear-gradient(90deg,transparent,#000 28%)}
.fhero>.fbn{position:relative;z-index:2;display:block;max-width:60%}
.fhero h1{margin:0 0 8px;font-size:40px;line-height:1.1;font-weight:800;letter-spacing:-.01em;color:#fff;display:block}
.fhero h1 .g{color:#F5A12E}
.fhero p{margin:0 0 14px;color:#DDEBE1;font-size:17px;line-height:1.5;max-width:520px}
.fpts{display:none;flex-wrap:wrap;gap:8px 10px;margin:0;padding:0;list-style:none}
.fhero[data-t=services] .fpts,.fhero[data-t=talent] .fpts{display:flex}
.fpts li{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 14px 5px 6px;font-size:13.5px;font-weight:600;color:#fff}
.fpts i{width:24px;height:24px;font-size:12px;background:var(--or);color:#fff}
.fhero .fex{display:none;margin-top:6px;background:var(--or)!important;border-color:var(--or)!important;color:#fff!important;font-weight:800;border-radius:12px;padding:11px 22px}
.fhero[data-t=orders] .fex,.fhero[data-t=hub] .fex{display:none}
.fhero[data-t=orders],.fhero[data-t=hub]{min-height:120px;padding:24px 34px}
/* body + category tiles */
.fbody{padding:0;background:none;border-radius:0;display:grid;gap:14px;align-content:start;min-width:0}
.ctiles{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin;scrollbar-color:#cdd8c8 transparent}
.ct{flex:0 0 112px;display:grid;justify-items:center;align-content:center;gap:8px;min-height:92px;padding:12px 8px;border:1px solid var(--ln);border-radius:16px;background:#fff;color:var(--ink);font:inherit;font-size:13px;font-weight:600;line-height:1.2;text-align:center;cursor:pointer;box-shadow:0 1px 3px rgba(11,74,46,.06);transition:border-color .15s,background .15s}
.ct svg{width:28px;height:28px;color:var(--gn)}
.ct:hover{border-color:var(--or)}
.ct.on{background:var(--gl);border-color:var(--gn);color:var(--gd)}
/* toolbar */
.fbh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0}
.fbl{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.fbh h2{margin:0;font-size:18px;font-weight:700;color:var(--ink);display:flex;align-items:baseline;gap:8px}
.fbh h2 small{font-size:13.5px;color:var(--mu);font-weight:500;margin:0}
.fopen{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:9px 14px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.fopen svg{color:var(--gn)}.fopen .cv{transition:transform .2s}.fopen.on{border-color:var(--gn);background:var(--gl)}.fopen.on .cv{transform:rotate(180deg)}
.fbr{display:flex;gap:12px;align-items:center}
.srt{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink)}
.srt select{border:1px solid var(--ln);border-radius:12px;padding:9px 14px;background:#fff;font:inherit;font-weight:600;color:var(--ink)}
.vtog{display:inline-flex;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:3px;gap:2px}
.vtog button{width:40px;height:34px;border:0;border-radius:9px;background:none;color:#4a5a50;display:grid;place-items:center;cursor:pointer}
.vtog button.on{background:var(--gn);color:#fff}
/* filter panel */
.flay{display:block}.flay>*{min-width:0}
.fside{display:none;background:#fff;border:1px solid var(--ln);border-radius:16px;padding:18px;box-shadow:none;overflow:visible}
.fside.open{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px 18px;align-items:end}
.fside>.fsh,.fside>p.m,.fside>.fsg.wide{grid-column:1/-1}
.fsh b{font-size:15px;color:var(--ink)}
.fsg h4{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--ink)}
.fsg select,.fsg input[type=number],.fsg input[type=text]{border:1px solid var(--ln);border-radius:10px;background:#fff;padding:10px 12px;font:inherit;font-size:14px}
.fsg select:focus-visible,.fsg input:focus-visible{outline:3px solid rgba(15,92,52,.25);border-color:var(--gn)}
.fsg .ck input{accent-color:var(--gn)}
.fside .clr{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gn);color:#fff;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:700;border:0;cursor:pointer}
.fside .clr:hover{background:var(--gd)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .fcat{width:auto;border:1px solid var(--ln);border-radius:999px;padding:6px 14px;background:#fff;color:var(--ink)}
.chips .fcat.on{background:var(--gn);border-color:var(--gn);color:#fff}
/* grid + list */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;min-width:0}
.vgrid.list{grid-template-columns:1fr}
/* service cards */
.sg{background:#fff;border:1px solid var(--ln);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0;cursor:pointer;box-shadow:0 2px 8px rgba(11,74,46,.07);transition:box-shadow .18s,transform .18s,border-color .18s}
.sg:hover{box-shadow:0 12px 26px rgba(11,74,46,.16);transform:translateY(-3px);border-color:#F9C27D}
.sgc{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-height:132px;padding:16px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));background-size:cover;background-position:center}
.sgc:before{content:"";position:absolute;right:-34px;top:-34px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1)}
.sgc b{position:relative;font-size:21px;line-height:1.08;font-weight:800;text-transform:uppercase;letter-spacing:.005em;text-shadow:0 2px 8px rgba(0,0,0,.28);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sgc small{position:relative;font-size:12px;opacity:.92;font-weight:600}
.sgh{position:absolute;right:10px;top:10px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:#fff;color:#7b8a80;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.sgh:hover{color:#e0483c}.sgh.on{color:#e0483c}.sgh.on svg{fill:#e0483c}
.sgb{display:grid;gap:10px;padding:14px 14px 16px;flex:1;align-content:start}
.sgs{display:flex;align-items:center;gap:9px;min-width:0}
.sgs .av{width:30px;height:30px;font-size:13px}
.sgs div{min-width:0;display:grid;line-height:1.25}
.sgs b{font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sgs b i{font-style:normal;color:var(--gn)}
.sgs small{font-size:12px;color:var(--mu)}.sgs small em{font-style:normal;color:var(--od2);font-weight:700}
.sgb p{margin:0;font-size:15px;line-height:1.4;color:var(--ink);font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px}
.sgm{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mu)}
.sgm span{display:inline-flex;align-items:center;gap:6px}
.sgm b{font-size:18px;font-weight:800;color:var(--gd);white-space:nowrap}
.sgo{border:0;border-radius:11px;background:var(--gn);color:#fff;padding:11px;font:inherit;font-weight:700;cursor:pointer;transition:background .15s}
.sg:hover .sgo,.sgo:hover{background:var(--gd)}
.pjb{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pjb .sgo,.pjb .pjv{padding:10px 8px;font-size:14px}.pjb.one{grid-template-columns:1fr}
.pjv{border:1px solid var(--ln);border-radius:11px;background:#fff;color:var(--ink);font:inherit;font-weight:700;cursor:pointer;transition:border-color .15s}.pjv:hover{border-color:var(--or)}
.pjc .sgb p{font-weight:500;font-size:14px;color:#4b443d;min-height:40px}.pjc .sgs small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psv.on{color:#e0483c;border-color:#e0483c}.psv.on svg{fill:#e0483c}.psv svg{vertical-align:-4px;margin-right:4px}
.pjd{display:grid;gap:6px;margin:10px 0;font-size:14px;color:#4b443d}.pjd div{display:flex;gap:8px;justify-content:space-between;border-bottom:1px dashed #e6dccd;padding:5px 0}.pjd b{color:var(--ink);text-align:right}
.vgrid.list .sg{display:grid;grid-template-columns:240px minmax(0,1fr)}
.vgrid.list .sgc{min-height:100%}
/* freelancer cards */
.tc2{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:18px;display:grid;gap:12px;align-content:start;min-width:0;cursor:pointer;box-shadow:0 2px 8px rgba(11,74,46,.07);transition:box-shadow .18s,transform .18s,border-color .18s}

<script>
shell("freelance.html");
(()=>{
const kes=n=>"KSh "+Number(n||0).toLocaleString("en-KE");
const opts=(a,v)=>a.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("");
const clean=v=>String(v||"").replace(/[%,()*\\_]/g," ").trim().slice(0,60);
const split=v=>String(v||"").split(",").map(x=>x.trim()).filter(Boolean).slice(0,15);

const SK='<div class="sk"></div>'.repeat(3);
const ERR={fl_bad_budget:"The pay must be inside the range SOKO Smart set for this service.",freelance_rate_freelancer:"Ratings are not set up yet. Run supabase-freelance-rating.sql in Supabase.",fl_rate_self:"You cannot rate yourself.",fl_rate_bad:"Choose a rating from 1 to 5 stars.",not_logged_in:"Please log in to rate freelancers.",fl_not_specialty:"This project needs a different specialty from yours.",fl_not_approved:"Only approved freelancers can apply.",fl_project_closed:"This project is no longer open.",fl_own_project:"You cannot apply to your own project.",fl_one_specialty:"You can only have one specialty. Choose a single service.",fl_self:"You cannot order your own service.",fl_service_off:"This service is no longer available.",fl_freelancer_off:"This freelancer is not available.",fl_unavailable:"This freelancer is not taking new orders right now.",fl_not_offered:"This freelancer does not offer that service.",fl_bad_addon:"One of the add-ons is not available.",fl_bad_package:"Please choose a package.",fl_bad_requirements:"Tell the freelancer what you need (at least 10 characters).",fl_not_yours:"You cannot do this on this order.",fl_bad_state:"This order has already moved on. Refresh and try again.",fl_locked:"That change is not allowed.",no_revisions:"No revisions are left on this order.",freelancer_wallet_missing:"This freelancer has not activated their wallet yet. Please try again later.",wallet_missing:"Open your wallet first so it can be created.",card_expired:"That wallet card has expired. Renew it first.",insufficient_funds:"That wallet balance is too low. Top up your wallet first."};
const errT=e=>{const m=String(e&&e.message||e),k=Object.keys(ERR).find(x=>m.includes(x));return k?ERR[k]:/row-level security|violates.*policy|permission denied/i.test(m)?"Your account is not allowed to save this yet. The Supabase permissions for freelancers are missing. Run supabase-freelance-v2.sql. ("+m+")":/function|schema cache|relation|does not exist/i.test(m)?"Freelance is not set up yet. Run supabase-freelance-v2.sql in Supabase.":m};

let U=null,ME=null,CAT=[],SV=[],CNT={},TOPF={},COMM=10,CATERR="",TAB=(HASHMAP[(location.hash||"").slice(1)]||(location.hash||"#services").slice(1));

const star=f=>f.rating_count?`${sv5(f.rating_avg)} <b>${Number(f.rating_avg).toFixed(1)}</b> · ${f.rating_count} review${f.rating_count===1?"":"s"}`:'<span class="nw">★ New freelancer</span>';
/* Instagram-style blue tick, earned automatically: account 2+ months old, rating 4.3+ and over 20 completed projects */
const VSVG='<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="#3897F0" d="M12 1.8l2.6 1.9 3.2-.1 1 3 2.6 1.9-1 3.1 1 3.1-2.6 1.9-1 3-3.2-.1L12 22.2l-2.6-1.9-3.2.1-1-3-2.6-1.9 1-3.1-1-3.1 2.6-1.9 1-3 3.2.1z"/><path d="M8 12.2l2.6 2.6L16 9.4" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const isVer=f=>{if(!f||!f.created_at)return false;const lim=new Date();lim.setMonth(lim.getMonth()-2);const d=new Date(f.created_at);return !isNaN(d)&&d<=lim&&(+f.rating_avg||0)>=4.3&&(+f.jobs_done||0)>20};

const av=(f,c)=>`<span class="av ${c||""}">${f.avatar_url?`<img alt="" src="${esc(f.avatar_url)}">`:esc((f.name||"?")[0].toUpperCase())}</span>`;

const pkgs=s=>Array.isArray(s.packages)?s.packages:[],addons=s=>Array.isArray(s.addons)?s.addons:[];

/* ---------- data ---------- */
async function loadCat(){if(!sb)return;
 const [c,s,fs,fp,st]=await Promise.all([sb.from("freelance_categories").select("*").eq("active",true).order("sort_order").order("name"),sb.from("freelance_services").select("*").eq("active",true).order("sort_order").order("title"),
  sb.from("freelancer_services").select("service_id,freelancer_id"),sb.from("freelancer_profiles").select("user_id,name,avatar_url,rating_avg,rating_count,jobs_done,created_at").eq("status","approved"),sb.from("freelance_settings").select("commission_percent").eq("id",1).maybeSingle()]);
 const bad=[c,s].find(x=>x.error);CATERR=bad?errT(bad.error):"";CAT=c.data||[];SV=s.data||[];
 const ok=new Set((fp.data||[]).map(x=>x.user_id));CNT={};(fs.data||[]).forEach(r=>{if(ok.has(r.freelancer_id))CNT[r.service_id]=(CNT[r.service_id]||0)+1});TOPF={};const PM={};(fp.data||[]).forEach(p=>PM[p.user_id]=p);(fs.data||[]).forEach(r=>{const p=PM[r.freelancer_id];if(!p)return;const c=TOPF[r.service_id],pa=+p.rating_avg||0,ca=c?+c.rating_avg||0:-1;if(!c||pa>ca||(pa===ca&&(+p.rating_count||0)>(+c.rating_count||0)))TOPF[r.service_id]=p});if(st.data)COMM=+st.data.commission_percent}

 if(kind==="image"&&!img)throw new Error("Please choose an image file");if(!img&&!vid)throw new Error(file.name+": portfolio files must be images or videos");

 const ext=(file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"")||"bin",p=`${U.id}/${tag}-${Date.now()}-${Math.random().toString(36).slice(2,6)}.${ext}`;
 const r=await sb.storage.from("listing-images").upload(p,file,{contentType:file.type});if(r.error)throw r.error;return {url:sb.storage.from("listing-images").getPublicUrl(p).data.publicUrl,type:vid?"video":"image"}}

 $("#fpan").innerHTML=`<div class="fc" style="cursor:default;background:#fff;margin-bottom:14px"><div class="row"><div style="display:flex;gap:12px;align-items:center">${av(ME)}<div><b>${esc(ME.name)}</b> <span class="fp ${ST[1]}">${esc(ME.status)}</span><div class="m">${esc(ME.title||"")} · ${star(ME)}</div></div></div><button class="btn p s" id="eprof">Edit profile</button></div><div class="m" style="margin-top:6px">${esc(ST[0])}</div></div>
 ${po.count?`<div class="fc" style="cursor:default;background:#FFF8EF;border-color:#F58E20;margin-bottom:14px"><div class="row"><b>${plural(po.count,"new order")} waiting for you to accept</b><button class="btn p s" data-t2="orders">View orders</button></div></div>`:""}

 $("#eprof").onclick=()=>profileForm(true);const t2=$("[data-t2]");if(t2)t2.onclick=()=>tab("orders");
 $("#sf").onsubmit=async e=>{e.preventDefault();const ids=[...e.target.querySelectorAll("[name=sv]:checked")].map(c=>c.value);if(!ids.length){toast("Choose at least one service","error");return}

async function profileForm(editing){U=await needUser("Log in or create an account to become a freelancer.");if(!U)return;await loadCat();if(editing)await loadMe();const m=editing&&ME?ME:{};

 if(!offered().length){toast("SOKO Smart has not approved any services yet. Please check back soon.","error");return}
 const gone=editing&&mine[0]&&!offered().some(x=>x.id===mine[0]);
 const hasAv=editing&&m.avatar_url;
 openD(`<h3 style="margin:0 0 4px">${editing?"Edit your freelancer profile":"Apply to become a freelancer"}</h3><p class="m" style="margin:0 0 10px">Fields marked * are required. Your phone number and email are private: only the SOKO Smart team can see them.</p>

 <label>Profile picture ${hasAv?"(leave empty to keep your current one)":"*"}<input name="av" type="file" accept="image/*" ${hasAv?"":"required"}></label>
 <div class="two"><label>Professional title *<input name="t" required maxlength="100" value="${esc(m.title||"")}" placeholder="e.g. Graphic Designer"></label><label>Years of experience *<input name="yx" type="number" min="0" max="60" required value="${esc(m.years_experience??"")}"></label></div>
 <label>About me / biography *<textarea name="b" rows="5" required minlength="50" maxlength="2000" placeholder="Tell clients about your experience, the work you do best and how you work.">${esc(m.bio||"")}</textarea></label>
 <div class="two"><label>County *<select name="c" required><option value="">Choose</option>${opts(COUNTIES,m.county)}</select></label><label>Town *<input name="tw" required maxlength="60" value="${esc(m.town||"")}"></label></div>
 <div class="two"><label>Phone number *<input name="ph" type="tel" inputmode="tel" required placeholder="0712 345 678" value="${esc(pv.phone||U.user_metadata?.phone||"")}"></label><label>Email *<input name="em" type="email" required value="${esc(pv.email||U.email||"")}"></label></div>
 <label>Skills (separate with commas) *<input name="s" required value="${esc((m.skills||[]).join(", "))}" placeholder="Photoshop, Illustrator, Branding"></label>
 <div><b style="font-size:13px">My specialty (choose one) *</b><p class="m" style="margin:2px 0 6px">Only services approved by SOKO Smart are listed. Every freelancer masters one service, so clients know exactly what you are best at. You cannot create services or change prices.</p>${gone?`<p class="m" style="margin:0 0 6px;color:#b3261e">The service you chose before is no longer offered. Please choose a new specialty.</p>`:""}<div class="chk">${svcGroups(mine.slice(0,1))}</div></div>
 ${editing?"":`<label>Portfolio images / videos * <span class="m">(add at least one; images under 3 MB, videos under 30 MB)</span><input name="pf" type="file" accept="image/*,video/*" multiple required></label><label>…or a portfolio video link<input name="pvl" type="url" placeholder="https://…"></label>`}
 <div class="two"><label>Portfolio website<input name="pw" type="url" value="${esc(m.portfolio_url||"")}" placeholder="https://…"></label><label>LinkedIn profile<input name="li" type="url" value="${esc(m.linkedin_url||"")}" placeholder="https://linkedin.com/in/…"></label></div>
 <label>Certifications (optional)<textarea name="ce" rows="2" maxlength="600">${esc(m.certifications||"")}</textarea></label>
 <label>Available for new work *<select name="a" required><option value="yes" ${m.available===false?"":"selected"}>Yes, I am available</option><option value="no" ${m.available===false?"selected":""}>No, not right now</option></select></label>
 <p class="m" style="margin:0">${editing?"":"Your application is reviewed by the SOKO Smart team before your profile becomes visible to clients."}</p><button class="btn p" id="pgo">${editing?"Save profile":"Submit application"}</button></form>`);
 $("#pfm").onsubmit=async e=>{e.preventDefault();const f=e.target,ids=[...f.querySelectorAll("[name=sv]:checked")].map(c=>c.value);if(!ids.length||!offered().some(x=>x.id===ids[0])){toast("Choose a specialty from the approved services","error");return}
  const phn=f.ph.value.replace(/[\s\-().]/g,"").replace(/^\+/,""),b=$("#pgo");if(!/^(254|0)[17][0-9]{8}$/.test(phn)){toast("Enter a valid Kenyan phone number, e.g. 0712 345 678","error");f.ph.focus();return}b.disabled=true;
  try{let avatar=m.avatar_url||null;if(f.av.files[0]){const u=await up(f.av.files[0],"avatar","image");avatar=u.url}
   const row={name:f.nm.value.trim(),avatar_url:avatar,title:f.t.value.trim(),bio:f.b.value.trim(),county:f.c.value,town:f.tw.value.trim(),skills:split(f.s.value),years_experience:+f.yx.value,portfolio_url:f.pw.value.trim()||null,linkedin_url:f.li.value.trim()||null,certifications:f.ce.value.trim()||null,available:f.a.value==="yes"};

   let r=await send(row);
   for(let i=0;r.error&&i<9;i++){const m=String(r.error.message||"").match(/'([a-z_]+)' column|column "?([a-z_]+)"?/i),c=m&&(m[1]||m[2]);if(!c||!OPT.includes(c)||!(c in row))break;console.warn("freelancer_profiles is missing column",c);delete row[c];r=await send(row)}
   if(r.error&&!editing&&/duplicate key|unique/i.test(r.error.message||""))r=await sb.from("freelancer_profiles").update(row).eq("user_id",U.id);

    if(link){const pi=await sb.from("freelancer_portfolio").insert({freelancer_id:U.id,title:"Video",media_url:link,media_type:"video",status:"pending"});if(pi.error)throw pi.error}}
