<style>
/* ---------- trending strip ---------- */
.tr{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--bd);margin-bottom:18px}
.tr .lb{display:inline-flex;gap:6px;align-items:center;color:var(--od);font-weight:800;white-space:nowrap}
.tr .lk{display:flex;gap:6px 0;flex-wrap:wrap;flex:1;min-width:200px;font-size:14px}
.tr .lk a{color:var(--tx);text-decoration:none;padding:0 14px;border-left:1px solid var(--bd)}
.tr .lk a:first-child{padding-left:0;border-left:0}.tr .lk a:hover{color:var(--g)}
.tr input{border:1px solid var(--bd);border-radius:999px;padding:8px 16px;font:inherit;min-width:200px;background:#fff}
/* ---------- layout ---------- */
.hz{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.hrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.tag{display:inline-block;width:fit-content;font-size:12px;font-weight:700;color:#fff;background:var(--g);border-radius:4px;padding:3px 9px}
.tag.o{background:var(--o)}
/* ---------- slideshow ---------- */
.hero{position:relative;border-radius:10px;overflow:hidden;min-height:430px;background:var(--gt);isolation:isolate}
.sl{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s}
.sl.on{opacity:1;visibility:visible;z-index:1}
.sl .bg{position:absolute;inset:0;display:grid;place-items:center;color:var(--g);background:linear-gradient(135deg,var(--gt),#fff)}
.sl .bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.sl .tag{background:var(--o);font-size:13px;padding:5px 12px}
.sl h2{margin:0;font-size:34px;line-height:1.15;max-width:92%}

.hnav{position:absolute;top:50%;z-index:3;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:var(--tx);cursor:pointer;display:grid;place-items:center}

.hnav svg{width:18px;height:18px}

.art .tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.art .tag{font-size:13px;padding:5px 12px;border-radius:6px;text-decoration:none}

.av{width:38px;height:38px;border-radius:50%;background:var(--g);color:#fff;display:inline-grid;place-items:center;font-weight:800;flex:none}
.shr{margin-left:auto;display:flex;gap:8px}

.prose h2,.prose h3,.prose h4{line-height:1.3;margin:1.5em 0 .45em;color:var(--tx)}.prose h2{font-size:25px}.prose h3{font-size:21px}
.prose p{margin:0 0 1.1em}.prose ul,.prose ol{margin:0 0 1.2em;padding-left:1.4em}.prose li{margin:.3em 0}

.prose blockquote{margin:1.3em 0;padding:14px 20px;border-left:5px solid var(--g);background:var(--gt);border-radius:10px;color:#1f3d2a;font-weight:600}
.act{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0;padding:14px 0;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.act button,.act a{display:inline-flex;gap:8px;align-items:center;border:1.5px solid var(--bd);background:#fff;border-radius:999px;padding:9px 18px;font:inherit;font-weight:700;color:var(--tx);cursor:pointer;text-decoration:none}

.act .on{border-color:var(--o);background:var(--ot);color:var(--od)}.act .on svg{fill:currentColor}

.ctl{display:inline-flex;align-items:center;gap:10px}.cnb{background:var(--g);color:#fff;font-size:14px;font-weight:800;min-width:28px;height:28px;padding:0 9px;border-radius:999px;display:inline-grid;place-items:center;line-height:1}

<script>
(function(){
shell("blog.html");
const COLS="id,title,slug,excerpt,content,cover_url,category,author_name,published_at,is_featured,views,subcategory";

 mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
 bolt:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>',
 star:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 7 7 .6-5.3 4.7L18.2 22 12 18.2 5.8 22l1.5-7.7L2 9.6 9 9z"/></svg>',
 bars:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4 20V10h4v10zm6 0V4h4v16zm6 0v-7h4v7z"/></svg>'};

/* ---------- slideshow ---------- */
let TIMER=null;
function slider(){
 clearInterval(TIMER);
 const hero=document.getElementById("hero");if(!hero)return;
 const S=[...hero.querySelectorAll(".sl")],D=[...hero.querySelectorAll(".hdots [data-i]")],C=hero.querySelector(".cn");
 let i=0;
 const go=n=>{i=(n+S.length)%S.length;S.forEach((s,k)=>{const on=k===i;s.classList.toggle("on",on);s.setAttribute("aria-hidden",on?"false":"true");s.querySelectorAll("a").forEach(a=>a.tabIndex=on?0:-1);const im=s.querySelector("img");if(on&&im)im.loading="eager"});D.forEach((d,k)=>d.classList.toggle("on",k===i));if(C)C.textContent=(i+1)+" / "+S.length};
 const play=()=>{clearInterval(TIMER);if(S.length>1&&!matchMedia("(prefers-reduced-motion:reduce)").matches)TIMER=setInterval(()=>go(i+1),5500)};
 hero.querySelector(".hnav.p")?.addEventListener("click",()=>{go(i-1);play()});
 hero.querySelector(".hnav.n")?.addEventListener("click",()=>{go(i+1);play()});
 D.forEach(d=>d.addEventListener("click",()=>{go(+d.dataset.i);play()}));
 hero.addEventListener("mouseenter",()=>clearInterval(TIMER));hero.addEventListener("mouseleave",play);
 hero.addEventListener("focusin",()=>clearInterval(TIMER));hero.addEventListener("focusout",play);
 let x0=null;hero.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
 hero.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>45){go(i+(dx<0?1:-1));play()}});
 go(0);play()}

async function post(slug){

 const a=r.data,url=location.origin+location.pathname.replace(/[^/]*$/,"")+"blog.html?p="+encodeURIComponent(a.slug),t=encodeURIComponent(a.title);
 document.title=a.title+" – SOKO Smart";
 const set=(sel,attr,v)=>{let m=document.querySelector(sel);if(!m){m=document.createElement("meta");const k=sel.match(/\[(\w+)="([^"]+)"\]/);m.setAttribute(k[1],k[2]);document.head.appendChild(m)}m.setAttribute(attr,v)};
 const desc=a.excerpt||String(a.content).replace(/[#*>\[\]()!_-]/g," ").replace(/\s+/g," ").trim().slice(0,155);
 set('meta[name="description"]',"content",desc);set('meta[property="og:title"]',"content",a.title);set('meta[property="og:description"]',"content",desc);if(a.cover_url)set('meta[property="og:image"]',"content",a.cover_url);

 const sess=await sb.auth.getSession(),U=sess.data&&sess.data.session?sess.data.session.user:null;

 let liked=false,saved=false,nLike=0,nCm=0,nSh=a.shares||0,isAdm=false;

  if(x.error)return toast(x.error.message,"error");cfm.reset();toast("Comment posted","ok");loadC()};
 loadC();
 $("#cmb").onclick=e=>{e.preventDefault();$("#cm").scrollIntoView({behavior:"smooth"})};

 /* sidebar */
 sb.rpc("blog_view",{p_id:a.id}).then(()=>{},()=>{});
 const sp=await pub("id,title,slug,cover_url,published_at,views").order("views",{ascending:false}).limit(5);
 $("#spop").innerHTML=(sp.data||[]).map((x,k)=>`<a class="pi" href="${link(x)}"><i>${k+1}</i><span class="th">${pic(x,22)}</span><span><b>${esc(x.title)}</b><small>${esc(dsh(x.published_at))}</small></span></a>`).join("")||'<div class="m" style="padding:12px">No articles yet.</div>';
 const bc=await sb.from("blog_categories").select("name").is("parent_id",null).order("sort_order");
 let names=!bc.error&&(bc.data||[]).length?bc.data.map(x=>x.name):null;
 if(!names){const sc=await pub("category").limit(300);names=[...new Set((sc.data||[]).map(x=>x.category).filter(Boolean))]}
 $("#scat").innerHTML=names.map(c=>`<a href="blog.html?c=${encodeURIComponent(c)}"><span>${ic("book",16)}</span>${esc(c)}</a>`).join("")||'<div class="m">No categories yet.</div>';
 $("#snl").onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector("button");b.disabled=true;
  const res=await sb.from("newsletter_subscribers").insert({email:f.email.value.trim().toLowerCase()});b.disabled=false;
  if(!res.error){toast("Thanks for subscribing!","ok");f.reset()}else if(res.error.code==="23505")toast("You’re already subscribed","ok");
  else toast(/relation|does not exist|schema cache|404/i.test(res.error.message||"")?"Newsletter sign-up is not set up yet":res.error.message,"error")};

 /* related */
 const RC="id,title,slug,excerpt,content,cover_url,category,author_name,published_at";
 let q=pub(RC).neq("id",a.id).order("published_at",{ascending:false}).limit(3);if(a.category)q=q.eq("category",a.category);
 let rel=await q;if(!rel.error&&(rel.data||[]).length<3&&a.category)rel=await pub(RC).neq("id",a.id).order("published_at",{ascending:false}).limit(3);
 if(!rel.error&&(rel.data||[]).length){const s=$("#rel");s.hidden=false;s.innerHTML=`<h2>Related Articles <a href="${catUrl}">View All →</a></h2><div class="rg">${rel.data.map(rcd).join("")}</div>`}}

P?post(P):list();
})();
</script>
